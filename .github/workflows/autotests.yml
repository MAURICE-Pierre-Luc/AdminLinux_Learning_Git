name: Auto-tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Compile
      run: | 
        make test_area
        make test_perimeter
    - name: Test
      run: |
        ./test_area
        ./test_perimeter
